<title>DNG Global Game Desk</title>
<style>
/* Layout: a production desk. Left column walks the workflow (setup → board → review → captions);
   right column holds the live 4:5 card with export. System fonts only; no remote assets. */
:root {
  --bg: #edf0f6; --surface: #ffffff; --surface-2: #f4f6fb; --ink: #121a2b; --muted: #59647a; --line: #d6dce8; --line-strong: #b5bfd2;
  --accent: #1d428a; --accent-ink: #ffffff; --gold: #ffc72c; --gold-ink: #3d2c00;
  --ok: #17663f; --ok-bg: #e2f3e9; --warn: #855000; --warn-bg: #fff1d2; --warn-line: #e0b155; --block: #a3271c; --block-bg: #fcebe8; --block-line: #e39a90;
  --shadow: 0 10px 30px rgba(18, 26, 43, 0.16);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1322; --surface: #151d30; --surface-2: #1b2438; --ink: #e5eaf4; --muted: #9aa6bd; --line: #28324a; --line-strong: #3a4662;
    --accent: #8fb0f0; --accent-ink: #0b1220; --gold: #ffc72c; --gold-ink: #2a1f00;
    --ok: #6fd3a0; --ok-bg: #12301f; --warn: #f2c063; --warn-bg: #362a0e; --warn-line: #77581b; --block: #ff9c90; --block-bg: #3a1814; --block-line: #82382e;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1322; --surface: #151d30; --surface-2: #1b2438; --ink: #e5eaf4; --muted: #9aa6bd; --line: #28324a; --line-strong: #3a4662;
  --accent: #8fb0f0; --accent-ink: #0b1220; --gold: #ffc72c; --gold-ink: #2a1f00;
  --ok: #6fd3a0; --ok-bg: #12301f; --warn: #f2c063; --warn-bg: #362a0e; --warn-line: #77581b; --block: #ff9c90; --block-bg: #3a1814; --block-line: #82382e;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 15px; display: flex; align-items: center; gap: 8px; }
h3 { font-size: 13px; }
p { margin: 0; }
.grow { flex: 1; }
.grow-right { margin-left: auto; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.lbl { font-size: 11.5px; font-weight: 650; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.hint { font-size: 12.5px; color: var(--muted); }
.err { color: var(--block); font-size: 13px; }
.ok-text { color: var(--ok); font-weight: 650; font-size: 13px; }
.warn-text { color: var(--warn); font-size: 13px; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; padding: 7px 9px; min-width: 0; max-width: 100%; }
textarea { width: 100%; resize: vertical; line-height: 1.5; }
input.num { width: 56px; text-align: center; font-variant-numeric: tabular-nums; }
input.wide-num { width: 90px; }
.mono, pre { font-family: var(--mono); }
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.link { border: 0; background: none; color: var(--accent); padding: 3px 4px; }
.btn.small { font-size: 12.5px; }
.icon { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; width: 28px; height: 28px; cursor: pointer; }
.icon:disabled { opacity: 0.35; cursor: default; }
.boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; color: var(--muted); }
.boot b { font: 800 28px var(--font); color: var(--accent); letter-spacing: 0.1em; }

/* header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-row select { max-width: 240px; }
.status { border: 1px solid transparent; border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 650; background: var(--surface-2); cursor: default; }
.tone-ok { color: var(--ok); background: var(--ok-bg); }
.tone-warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
.tone-block { color: var(--block); background: var(--block-bg); border-color: var(--block-line); cursor: pointer; }
.tone-muted { color: var(--muted); }
.tone-info { background: var(--surface-2); }
.trust { background: var(--gold); color: var(--gold-ink); font-weight: 700; font-size: 12.5px; padding-block: 5px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.session { background: var(--warn-bg); color: var(--warn); font-size: 12.5px; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.menu { position: relative; }
.menu > summary { list-style: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu-pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 6px; min-width: 230px; display: flex; flex-direction: column; }
.menu-pop > button, .menu-pop .file { text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.menu-pop > button:hover, .menu-pop .file:hover { background: var(--surface-2); }
.menu-pop > button:disabled { opacity: 0.5; }
.menu-pop .danger { color: var(--block); }
.file input { display: none; }

/* layout */
.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 430px); gap: 16px; align-items: start; max-width: 1300px; margin: 0 auto; padding-block: 16px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.preview-col { position: sticky; top: 110px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.step { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 800; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; border: 0; padding: 0; margin: 0; }
.field.wide { grid-column: 1 / -1; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; width: fit-content; }
.seg label { padding: 6px 14px; cursor: pointer; font-weight: 600; border-right: 1px solid var(--line); }
.seg label:last-child { border-right: 0; }
.seg label.on { background: var(--accent); color: var(--accent-ink); }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg label:focus-within { outline: 2px solid var(--accent); outline-offset: -2px; }
.ref-card { border: 1px dashed var(--line-strong); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); }
.ref-card a { color: var(--accent); overflow-wrap: anywhere; }
.ambig { border: 1px solid var(--warn-line); background: var(--warn-bg); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.ambig legend { font-weight: 700; color: var(--warn); padding: 0 4px; }
.problems { margin: 0; padding: 8px 12px 8px 28px; border-radius: 8px; background: var(--surface-2); color: var(--muted); font-size: 13px; }
.problems.block { background: var(--block-bg); color: var(--block); font-weight: 600; }

.cities { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.city { display: grid; grid-template-columns: minmax(110px, 1.2fr) 88px minmax(0, 1.4fr) 64px auto; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 6px; background: var(--surface-2); }
.c-name { font-weight: 650; }
.c-time { font-weight: 750; font-variant-numeric: tabular-nums; text-align: right; }
.c-date { color: var(--muted); }
.c-off { color: var(--warn); font-weight: 700; font-size: 12.5px; }
.c-wait { grid-column: 2 / 5; }
.c-act { display: inline-flex; gap: 3px; }
.review { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0 0 10px; }
.review dt { color: var(--muted); font-size: 12.5px; font-weight: 650; }
.review dd { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.diff { background: var(--warn-bg); color: var(--warn); border-radius: 4px; padding: 0 6px; font-weight: 600; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); }
.tag.warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
.tag.block { color: var(--block); background: var(--block-bg); border-color: var(--block-line); }
.caption { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.cap-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.warns { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--warn); }
.fallback { display: flex; flex-direction: column; gap: 6px; }
.ai { border-radius: 6px; padding: 8px 10px; font-size: 13px; }
.ai pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; max-height: 200px; overflow: auto; }

.card-canvas { width: 100%; height: auto; aspect-ratio: 4 / 5; border-radius: 8px; display: block; box-shadow: var(--shadow); max-width: 100%; }
.card-empty { aspect-ratio: 4 / 5; border: 2px dashed var(--line-strong); border-radius: 8px; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }
.export-status { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.inline-img { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.inline-img img { width: 100%; max-width: 100%; border-radius: 6px; border: 1px solid var(--line); }
.shot { position: fixed; inset: 0; z-index: 100; background: #05080f; display: grid; place-items: center; padding: 8px; }
.shot-canvas { max-width: 100%; max-height: calc(100vh - 16px); width: auto; height: calc(100vh - 16px); aspect-ratio: 4 / 5; }
.shot-exit { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 10px); background: rgba(255, 255, 255, 0.12); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 6px; padding: 6px 10px; cursor: pointer; opacity: 0.5; }
.shot-exit:hover, .shot-exit:focus { opacity: 1; }

.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(5, 10, 20, 0.5); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); width: min(620px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.preview-text { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-2); border-radius: 6px; padding: 10px; font-size: 12.5px; margin: 0; }
.toasts { position: fixed; z-index: 80; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; flex-direction: column; gap: 8px; width: min(520px, calc(100vw - 32px)); pointer-events: none; }
.toast { padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow); font-size: 13px; background: var(--ink); color: var(--surface); }
.toast.tone-ok, .toast.tone-warn, .toast.tone-block, .toast.tone-info { background: var(--ink); color: var(--surface); }

@media (max-width: 1000px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .preview-col { position: static; order: 0; }
}
@media (max-width: 560px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .city { grid-template-columns: minmax(0, 1fr) auto; }
  .c-date { grid-column: 1; }
  .c-off { grid-column: 2; text-align: right; }
  .c-act { grid-column: 1 / -1; justify-content: flex-end; }
  .c-wait { grid-column: 1 / -1; }
  .review { grid-template-columns: minmax(0, 1fr); }
  .top-row select { max-width: 100%; flex: 1 1 160px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
