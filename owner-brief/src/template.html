<title>Margot's Owner Brief</title>
<style>
/* Layout: an owner's briefing desk. Title bar with storage badge and Capture, a scrollable tab row,
   then one working view at a time. System fonts only: no remote fonts or scripts. */
:root {
  --bg: #eef2f0; --surface: #ffffff; --surface-2: #f5f8f6; --ink: #18221f; --muted: #5b6964; --line: #d5ddd9; --line-strong: #b6c2bd;
  --accent: #23584a; --accent-ink: #ffffff; --accent-soft: #e2eee9;
  --ok: #1d6a44; --ok-bg: #e3f2ea; --warn: #865000; --warn-bg: #fff1d4; --warn-line: #e3b25a;
  --block: #a22a1e; --block-bg: #fcebe8; --block-line: #e39b91;
  --ai: #5f3fb0; --ai-bg: #f0ebfb; --src: #1c5b9e; --src-bg: #e5eef9; --own: #3b4a45; --own-bg: #e8eeeb;
  --shadow: 0 8px 28px rgba(24, 34, 31, 0.14);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101614; --surface: #18211e; --surface-2: #1d2925; --ink: #e4ece8; --muted: #9baba5; --line: #2b3934; --line-strong: #3d4e48;
    --accent: #7fc4ad; --accent-ink: #0e1a16; --accent-soft: #1c332b;
    --ok: #6fd1a0; --ok-bg: #143126; --warn: #f0be62; --warn-bg: #39290d; --warn-line: #77571a;
    --block: #ff9b8e; --block-bg: #3c1814; --block-line: #85392f;
    --ai: #bba4f5; --ai-bg: #2a2142; --src: #8fbcf2; --src-bg: #182a40; --own: #c4d3cd; --own-bg: #26332f;
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101614; --surface: #18211e; --surface-2: #1d2925; --ink: #e4ece8; --muted: #9baba5; --line: #2b3934; --line-strong: #3d4e48;
  --accent: #7fc4ad; --accent-ink: #0e1a16; --accent-soft: #1c332b;
  --ok: #6fd1a0; --ok-bg: #143126; --warn: #f0be62; --warn-bg: #39290d; --warn-line: #77571a;
  --block: #ff9b8e; --block-bg: #3c1814; --block-line: #85392f;
  --ai: #bba4f5; --ai-bg: #2a2142; --src: #8fbcf2; --src-bg: #182a40; --own: #c4d3cd; --own-bg: #26332f;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
h2 { font-size: 18px; letter-spacing: -0.01em; }
h3 { font-size: 14px; letter-spacing: 0.02em; margin-top: 6px; }
h4 { font-size: 13px; }
p { margin: 0; }
.grow { flex: 1; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.nowrap { flex-wrap: nowrap; }
.row.end { justify-content: flex-end; }
.stack { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.stack-l { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.grid2.top-align { align-items: start; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.lbl { font-size: 11.5px; font-weight: 650; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.hint { font-size: 12.5px; color: var(--muted); }
.none { color: var(--muted); font-style: italic; }
.warn-text { color: var(--warn); }
input, select, textarea { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; padding: 7px 9px; min-width: 0; max-width: 100%; }
textarea { width: 100%; resize: vertical; line-height: 1.5; }
input[type="checkbox"] { accent-color: var(--accent); }
.mono, pre { font-family: var(--mono); }

.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-weight: 560; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 4px 9px; font-size: 12.5px; }
.btn.link { border: 0; background: none; color: var(--accent); padding: 3px 4px; }
.btn.danger, .btn.link.danger { color: var(--block); }
.file-btn { display: inline-block; width: fit-content; }
.file-btn input { display: none; }
.toggle { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font-size: 13px; }
.inline-form { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 6px; color: var(--muted); }
.boot .mark { font: 700 26px var(--mono); color: var(--accent); }

/* header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-row { display: flex; align-items: center; gap: 10px; padding-block: 10px 6px; flex-wrap: wrap; }
.title { font-size: 17px; font-weight: 750; letter-spacing: -0.015em; }
.badge-store { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 650; border: 1px solid transparent; cursor: default; background: var(--surface-2); }
.badge-store .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; }
.tab { border: 0; background: none; padding: 8px 10px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; color: var(--muted); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.count { background: var(--muted); color: var(--surface); border-radius: 999px; padding: 0 6px; font-size: 11px; }
.count.warn { background: var(--warn); }

.tone-ok { color: var(--ok); background: var(--ok-bg); }
.tone-warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
.tone-block { color: var(--block); background: var(--block-bg); border-color: var(--block-line); }
.tone-muted { color: var(--muted); background: var(--surface-2); }
.tone-info { color: var(--ink); background: var(--accent-soft); }
.tone-ai { color: var(--ai); background: var(--ai-bg); border: 1px dashed var(--ai); }
.tone-src { color: var(--src); background: var(--src-bg); }
.tone-own { color: var(--own); background: var(--own-bg); }
.badge-store.tone-warn, .badge-store.tone-block { cursor: pointer; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 4px; white-space: nowrap; vertical-align: 1px; }

.ai-bar { margin: 10px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); border-radius: 8px; padding: 9px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border: 1px solid transparent; }
.raw-out { flex-basis: 100%; }
.raw-out pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow: auto; background: var(--surface); padding: 8px; border-radius: 6px; font-size: 12px; }

.main { padding-block: 16px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.main > section { display: flex; flex-direction: column; gap: 12px; }
.view-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
details.panel > summary { cursor: pointer; font-weight: 650; }
details.panel[open] { gap: 8px; }
.banner { border-radius: 6px; padding: 8px 12px; font-size: 13px; border: 1px solid transparent; }
.banner ul { margin: 4px 0 0; padding-left: 18px; }
.banner.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-line); }
.banner.block { background: var(--block-bg); color: var(--block); border-color: var(--block-line); }

/* cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; overflow-wrap: anywhere; }
.card.archived { opacity: 0.7; border-style: dashed; }
.card-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-h h3, .card-h h4 { margin: 0; }
.card-f { border-top: 1px solid var(--line); padding-top: 8px; }
.kv { display: grid; grid-template-columns: 112px 1fr; gap: 8px; font-size: 13px; }
.kv .k { color: var(--muted); font-size: 12px; font-weight: 600; padding-top: 1px; }
.kv .v { min-width: 0; }
.mini { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 3px; }
.dateline { font-size: 12px; color: var(--muted); white-space: nowrap; }
.sep { margin: 0 5px; }
.meta { font-size: 12.5px; color: var(--muted); }
.raw { margin: 0; padding: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto; }
.raw.small { max-height: 140px; }
.items h4 { margin: 6px 0 4px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
.item-list, .staged-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.item, .staged-list li { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; padding: 6px 8px; background: var(--surface-2); border-radius: 6px; }
.it-text { flex: 1 1 200px; min-width: 0; }
.item-actions { margin-left: auto; display: inline-flex; gap: 2px; }
.excerpt { font-size: 12px; color: var(--muted); font-style: italic; }
.ref { display: inline-flex; align-items: center; gap: 4px; font: 600 11.5px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.ref-stale { color: var(--warn); border-color: var(--warn-line); background: var(--warn-bg); }
.ref-missing { color: var(--block); border-color: var(--block-line); background: var(--block-bg); }
.refs { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.ref .x { border: 0; background: none; cursor: pointer; color: inherit; padding: 0 2px; }
.staged { border: 1px dashed var(--ai); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.notes { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--warn); }
.correct, .history { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 8px; }
.rev { display: flex; flex-direction: column; gap: 4px; }
.add-item input { flex: 1 1 200px; }
.sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.side { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.hist summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
.hist ul { margin: 4px 0 0; padding-left: 18px; font-size: 12.5px; }
.q { font-weight: 600; }

/* brief */
.brief h3 { border-top: 1px solid var(--line); padding-top: 10px; font-size: 12.5px; letter-spacing: 0.08em; }
.coverage { font-size: 12.5px; background: var(--surface-2); border-radius: 6px; padding: 8px 10px; }
.coverage summary { cursor: pointer; font-weight: 650; }
.coverage ul { margin: 6px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.bullets { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.b-item { display: flex; flex-direction: column; gap: 2px; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.clamp:hover { -webkit-line-clamp: unset; }
.rationale { font-size: 12.5px; color: var(--muted); }
.neutral { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }

/* assignments */
.assign-layout { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 14px; align-items: start; }
.assign-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.assign-btn { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 10px; cursor: pointer; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.assign-btn.on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
#assign-text { font: 13px/1.55 var(--mono); }

.help ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }

/* modal & toasts */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(10, 16, 14, 0.45); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); width: min(620px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.toasts { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; flex-direction: column; gap: 8px; width: min(540px, calc(100vw - 32px)); pointer-events: none; }
.toast { padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow); font-size: 13px; background: var(--ink); color: var(--surface); }
.toast.tone-ok { border-left: 4px solid var(--ok); background: var(--ink); color: var(--surface); }
.toast.tone-warn { border-left: 4px solid var(--warn-line); background: var(--ink); color: var(--surface); }
.toast.tone-info { background: var(--ink); color: var(--surface); }

@media (max-width: 720px) {
  .assign-layout { grid-template-columns: minmax(0, 1fr); }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .cards { grid-template-columns: minmax(0, 1fr); }
  .grid2.top-align { grid-template-columns: minmax(0, 1fr); }
  .dateline { white-space: normal; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<div id="root"></div>
<script>/*__APP__*/</script>
