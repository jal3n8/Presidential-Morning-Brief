<title>Research-to-Publish Studio</title>

<style>
/* Layout: a research desk. Utility bar on top, packet drawer left, two working panes (Sources | Draft),

:root {
  --bg: #eef2f4; --surface: #ffffff; --surface-2: #f6f8f9; --ink: #13202b; --muted: #5a6876; --line: #d5dde3; --line-strong: #b7c3cc;

  --block: #a8251a; --block-bg: #fdebe8; --block-line: #e59a90;
  --ai: #6141b8; --ai-bg: #f0ebfb; --exact: #0c6f6a; --exact-bg: #e0f3f1; --review: #2a3a4b; --review-bg: #e8edf2;
  --woi: #2b7a4b; --dng: #c48a00; --as101: #c2410c;

  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f161c; --surface: #172129; --surface-2: #1c2832; --ink: #e5ecf1; --muted: #9aa9b6; --line: #2a3843; --line-strong: #3b4c59;
    --accent: #8fb5f0; --accent-ink: #0d1822; --accent-soft: #1d2f45;
    --ok: #6fd3a6; --ok-bg: #133126; --warn: #f2c066; --warn-bg: #3a2b0e; --warn-line: #7a5a1c;
    --block: #ff9c90; --block-bg: #3d1814; --block-line: #84392f;
    --ai: #b9a2f5; --ai-bg: #2a2142; --exact: #6fd6cf; --exact-bg: #11302f; --review: #c9d6e2; --review-bg: #24313d;
    --woi: #6ccf95; --dng: #f0c24f; --as101: #ff9a64;

    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f161c; --surface: #172129; --surface-2: #1c2832; --ink: #e5ecf1; --muted: #9aa9b6; --line: #2a3843; --line-strong: #3b4c59;
  --accent: #8fb5f0; --accent-ink: #0d1822; --accent-soft: #1d2f45;
  --ok: #6fd3a6; --ok-bg: #133126; --warn: #f2c066; --warn-bg: #3a2b0e; --warn-line: #7a5a1c;
  --block: #ff9c90; --block-bg: #3d1814; --block-line: #84392f;
  --ai: #b9a2f5; --ai-bg: #2a2142; --exact: #6fd6cf; --exact-bg: #11302f; --review: #c9d6e2; --review-bg: #24313d;
  --woi: #6ccf95; --dng: #f0c24f; --as101: #ff9a64;
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); }
#root { min-height: 100%; }
* { box-sizing: border-box; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.small { font-size: 12.5px; }

/* boot */
.boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 8px; color: var(--muted); }
.boot-mark, .wordmark { font-family: var(--mono); font-weight: 700; letter-spacing: -0.02em; }
.boot-mark { font-size: 28px; color: var(--accent); }

/* top bar */
.app { min-height: 100%; display: flex; flex-direction: column; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 8px; padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.wordmark { color: var(--accent); font-size: 15px; padding-right: 4px; }

.brand-select { font-weight: 600; border-left-width: 4px; }
.brand-select.brand-woi_equity { border-left-color: var(--woi); }

.pill { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); cursor: default; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill-ok { color: var(--ok); background: var(--ok-bg); border-color: transparent; }
.pill-warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); cursor: pointer; }
.pill-block { color: var(--block); background: var(--block-bg); border-color: var(--block-line); cursor: pointer; }
.pill-muted { color: var(--muted); }
.menu-wrap { position: relative; }
.popover { position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px; min-width: 240px; display: flex; flex-direction: column; }
.popover > button, .menu-file { text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.popover > button:hover, .menu-file:hover { background: var(--surface-2); }
.menu-file input { display: none; }
.popover hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
.settings-pop { width: min(360px, calc(100vw - 32px)); padding: 14px; gap: 10px; }
.settings-pop h3 { margin: 4px 0 0; font-size: 14px; }
.privacy { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

/* body */
.body { display: flex; flex: 1; min-height: 0; position: relative; }
.drawer { width: 260px; flex: none; border-right: 1px solid var(--line); background: var(--surface-2); padding: 14px 12px 14px max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; font-weight: 600; }
.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.packet-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.packet-list li { display: flex; align-items: center; border-radius: 6px; }
.packet-list li.current { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); }
.packet-btn { flex: 1; min-width: 0; border: 0; background: none; text-align: left; cursor: pointer; padding: 8px; display: grid; grid-template-columns: 10px 1fr; column-gap: 8px; }
.packet-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.packet-meta { grid-column: 2; font-size: 11.5px; color: var(--muted); }
.brand-dot { width: 8px; height: 8px; border-radius: 2px; align-self: center; }
.brand-dot.brand-woi_equity { background: var(--woi); }

.brand-dot.brand-agent_skills_101 { background: var(--as101); }

.workspace { flex: 1; min-width: 0; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
.panes { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; align-items: start; }
.pane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.pane-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pane-head h2 { margin: 0; font-size: 16px; letter-spacing: -0.01em; }

/* guardrail */
.guard { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); }
.guard-bar { width: 90px; height: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); position: relative; overflow: hidden; }
.guard-bar span { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.guard-bar i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--warn); }
.guard.warn { color: var(--warn); } .guard.warn .guard-bar span { background: var(--warn); }
.guard.over { color: var(--block); } .guard.over .guard-bar span { background: var(--block); }

/* sources */
.paste-box { display: flex; flex-direction: column; gap: 8px; }
.meta-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.source-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.src-card { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); min-width: 0; }

.src-card.excluded { opacity: 0.6; }
.src-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sid { font-family: var(--mono); font-weight: 700; font-size: 12.5px; background: var(--ink); color: var(--surface); padding: 1px 6px; border-radius: 4px; }
.badge { font-size: 11px; font-weight: 650; padding: 2px 7px; border-radius: 4px; letter-spacing: 0.02em; }
.badge-text { background: var(--exact-bg); color: var(--exact); }
.badge-link { background: var(--warn-bg); color: var(--warn); }
.badge-unsafe { background: var(--block-bg); color: var(--block); }
.src-title { font-weight: 650; overflow-wrap: anywhere; }
.src-url { overflow-wrap: anywhere; }
.src-url a { color: var(--accent); }
.inert { font-family: var(--mono); color: var(--block); }
.src-text { margin: 4px 0; padding: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto; }
.src-edit { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.src-actions { gap: 12px; }
.empty-src { border: 1px dashed var(--line-strong); border-radius: var(--r); padding: 14px; color: var(--muted); }

/* draft */
.evidence-btn { margin-left: auto; display: inline-flex; gap: 8px; align-items: center; }
.evidence-btn .count { background: var(--muted); color: var(--surface); border-radius: 999px; padding: 0 7px; font-size: 11.5px; }
.evidence-btn.has-warn .count { background: var(--warn); }
.evidence-btn.has-block .count { background: var(--block); }
.gen-controls { display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.gen-row { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.status { padding: 8px 10px; border-radius: 6px; font-size: 13px; background: var(--surface-2); }
.status-ok { background: var(--ok-bg); color: var(--ok); }
.status-warn { background: var(--warn-bg); color: var(--warn); }
.status-block { background: var(--block-bg); color: var(--block); }
.draft-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: var(--surface-2); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
.tab.on { background: var(--surface); border-color: var(--ink); font-weight: 650; }
.editor { display: flex; flex-direction: column; gap: 10px; }
.banner { border-radius: 6px; padding: 9px 12px; font-size: 13px; border: 1px solid transparent; }
.banner ul { margin: 6px 0; padding-left: 18px; }
.banner.info { background: var(--accent-soft); }
.banner.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-line); }
.banner.block { background: var(--block-bg); color: var(--block); border-color: var(--block-line); }
.cards { display: flex; flex-direction: column; gap: 10px; }
.card-edit { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.card-edit textarea, .single-edit textarea { border-color: var(--line); background: var(--surface); font-size: 14.5px; }
.card-edit.source-card { border-style: dashed; }
.card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card-num { font-family: var(--mono); font-weight: 700; font-size: 12.5px; }
.single-edit { display: flex; flex-direction: column; gap: 6px; }
.counter { font-size: 12px; color: var(--muted); font-family: var(--mono); }
.counter.over { color: var(--warn); font-weight: 700; }
.hl-preview { font-size: 13px; padding: 6px 8px; background: var(--surface-2); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
.hl-preview mark { background: var(--block-bg); color: var(--block); font-weight: 700; border-radius: 3px; }
.editor-foot { border-top: 1px solid var(--line); padding-top: 6px; }
.brief-extras { border-top: 1px solid var(--line); padding-top: 8px; }
.brief-extras h3 { font-size: 13px; margin: 8px 0 6px; }
.register { margin: 0; padding-left: 18px; overflow-wrap: anywhere; }
.empty-draft { border: 1px dashed var(--line-strong); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; color: var(--muted); }
.empty-draft p { margin: 0; }
.export-bar { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.block-note { flex-basis: 100%; margin: 0; color: var(--block); font-size: 12.5px; }

/* evidence layers */
.layer { font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 4px; letter-spacing: 0.02em; display: inline-block; }
.layer-ai { color: var(--ai); background: var(--ai-bg); border: 1px dashed var(--ai); }
.layer-exact { color: var(--exact); background: var(--exact-bg); }
.layer-review { color: var(--review); background: var(--review-bg); }
.layer-warn { color: var(--warn); background: var(--warn-bg); }
.layer-block { color: var(--block); background: var(--block-bg); }
.evidence { position: fixed; z-index: 25; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) 24px 16px;
  /* wide screens: sits beside the panes under the top bar, never covering the editor */ display: flex; flex-direction: column; gap: 10px; }
.ev-head { display: flex; align-items: center; }
.ev-head h2 { margin: 0; font-size: 16px; flex: 1; }
.ev-sec { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.ev-sec h3 { margin: 0; font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.status-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin: 0; font-size: 13px; }
.status-grid dd { margin: 0; }
.issues, .claims, .quotes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.issue { padding: 6px 8px; border-radius: 6px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; overflow-wrap: anywhere; }
.issue .tag { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; }
.issue.block { background: var(--block-bg); color: var(--block); }
.issue.warn { background: var(--warn-bg); color: var(--warn); }
.claims li { padding-left: 10px; border-left: 2px dashed var(--ai); overflow-wrap: anywhere; }
.claims li.stale { opacity: 0.6; }
.claims .ids { font-family: var(--mono); font-size: 12px; color: var(--ai); font-weight: 700; }
.q { display: flex; flex-direction: column; gap: 2px; padding: 6px 8px; border-radius: 6px; background: var(--surface-2); overflow-wrap: anywhere; }
.q-failed { background: var(--block-bg); }
.q-marks_removed { background: var(--warn-bg); }
.q-text { font-style: italic; }

/* modal & toasts */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(10, 18, 25, 0.45); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); width: min(620px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.modal h2 { margin: 0; font-size: 17px; }
.modal p { margin: 0; }
.manual-text { font: 12.5px/1.5 var(--mono); }
.import-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.import-list li { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.toasts { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; flex-direction: column; gap: 8px; width: min(560px, calc(100vw - 32px)); pointer-events: none; }
.toast { background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow); font-size: 13px; }
.toast-ok { border-left: 4px solid var(--ok); }
.toast-warn { border-left: 4px solid var(--warn-line); }
.toast-block { border-left: 4px solid var(--block); }

@media (min-width: 1280px) {
  .evidence { top: calc(env(safe-area-inset-top, 0px) + var(--topbar-h, 56px)); z-index: 15; box-shadow: none; padding-top: 14px; width: 400px; }

}
@media (max-width: 1100px) {
  .drawer { position: fixed; z-index: 24; top: 0; bottom: 0; left: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 60px); box-shadow: var(--shadow); width: min(300px, 86vw); }
}
@media (max-width: 900px) {

}
@media (max-width: 520px) {
  .meta-grid { grid-template-columns: minmax(0, 1fr); }
  .title-input { order: 10; flex-basis: 100%; max-width: none; }
  .guard { margin-left: 0; }
  .wordmark { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
